<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password — JIT BANK</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="logo">
        <h1>JIT BANK</h1>
        <p>Choose a new password</p>
      </div>

      <div id="alert" class="alert alert-error" style="display:none;"></div>
      <div id="success" class="alert alert-success" style="display:none;"></div>

      <form id="resetForm">
        <div class="form-group">
          <label for="password">New password</label>
          <input type="password" id="password" required minlength="8" placeholder="At least 8 characters" />
        </div>
        <div class="form-group">
          <label for="confirm">Confirm new password</label>
          <input type="password" id="confirm" required minlength="8" placeholder="Repeat password" />
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">
          <span id="btnText">Update Password</span>
        </button>
      </form>

      <div class="auth-footer">
        <a href="login.html">← Back to Sign In</a>
      </div>
      <p class="disclaimer">
        Demo page. In production this page would validate a secure one-time token from the email link before allowing a password change.
      </p>
    </div>
  </div>

  <script>
    document.getElementById('resetForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const p = document.getElementById('password').value;
      const c = document.getElementById('confirm').value;
      const alert = document.getElementById('alert');
      const success = document.getElementById('success');
      alert.style.display = 'none';
      success.style.display = 'none';

      if (p !== c) {
        alert.textContent = 'Passwords do not match';
        alert.style.display = 'block';
        return;
      }
      success.textContent = 'Password would be updated here (demo only). You can now sign in.';
      success.style.display = 'block';
      document.getElementById('submitBtn').disabled = true;
    });
  </script>
</body>
</html>
