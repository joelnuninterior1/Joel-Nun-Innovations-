<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — JIT BANK</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">JIT BANK</div>
      <nav>
        <a href="dashboard.html">🏠 Dashboard</a>
        <a href="transfer.html">↗ Transfer</a>
        <a href="transactions.html">📋 Transactions</a>
        <a href="profile.html" class="active">👤 Profile</a>
      </nav>
      <div class="bottom">
        <a href="#" onclick="logout();return false;" style="color:#94A3B8;">Sign out</a>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <h2>Profile & Settings</h2>
        <div class="user-chip">
          <span id="userName">—</span>
          <div class="avatar" id="userAvatar">?</div>
        </div>
      </header>

      <div class="content">
        <div class="card" style="max-width:480px;">
          <h3>Account Information</h3>
          <div class="form-group">
            <label>Full name</label>
            <input type="text" id="fullName" readonly />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" readonly />
          </div>
          <div class="form-group">
            <label>User ID</label>
            <input type="text" id="userId" readonly style="font-family:monospace;font-size:13px;" />
          </div>
        </div>

        <div class="card" style="max-width:480px;">
          <h3>Security</h3>
          <p style="font-size:14px;color:var(--muted);margin-bottom:16px;">
            Password reset and device management would appear here in a production system.
          </p>
          <a href="forgot-password.html" class="btn btn-secondary" style="width:auto;">Change Password</a>
        </div>

        <div class="card" style="max-width:480px;">
          <h3>Session</h3>
          <button class="btn btn-danger" style="width:auto;" onclick="logout()">Sign Out</button>
        </div>

        <p class="disclaimer">
          Educational demonstration only. Not a licensed financial institution.
        </p>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    if (!requireAuth()) throw new Error('redirect');

    const user = getStoredUser();
    if (user) {
      document.getElementById('userName').textContent = user.fullName || user.email || 'User';
      document.getElementById('userAvatar').textContent = (user.fullName || user.email || '?')[0].toUpperCase();
      document.getElementById('fullName').value = user.fullName || '—';
      document.getElementById('email').value = user.email || '—';
      document.getElementById('userId').value = user.id || '—';
    }
  </script>
</body>
</html>
