<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — JIT BANK</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="logo">
        <h1>JIT BANK</h1>
        <p>Open your free account</p>
      </div>

      <div id="alert" class="alert alert-error" style="display:none;"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="fullName">Full name</label>
          <input type="text" id="fullName" required autocomplete="name" placeholder="Ada Lovelace" />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="new-password" placeholder="At least 8 characters" minlength="8" />
        </div>
        <div class="form-group">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" required autocomplete="new-password" placeholder="Repeat password" minlength="8" />
        </div>
        <button type="submit" class="btn btn-primary" id="submitBtn">
          <span id="btnText">Create Account</span>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
      <p class="disclaimer">Educational demo only. Not a real bank. No real funds are held.</p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    if (localStorage.getItem('jit_token')) {
      window.location.href = 'dashboard.html';
    }

    const form = document.getElementById('registerForm');
    const alertEl = document.getElementById('alert');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.style.display = 'none';

      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password !== confirm) {
        alertEl.textContent = 'Passwords do not match';
        alertEl.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      btnText.textContent = 'Creating account…';

      try {
        const data = await register(
          document.getElementById('email').value.trim(),
          password,
          document.getElementById('fullName').value.trim()
        );
        saveSession(data.token, data.user);
        window.location.href = 'dashboard.html';
      } catch (err) {
        alertEl.textContent = err.message || 'Registration failed';
        alertEl.style.display = 'block';
        submitBtn.disabled = false;
        btnText.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
